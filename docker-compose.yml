version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: mlops-a1-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mlops}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  backend:
    build:
      context: .
      dockerfile: backend/mlops-go-api/Dockerfile
    container_name: mlops-a1-backend
    env_file: .env
    environment:
      - PORT=8080
      # Set BACKEND_BASE_URL=http://<ec2-public-ip>:8080 in .env to enable
      # async Lambda invocation with callback. Leave unset for sync mode (local dev).
      - BACKEND_BASE_URL=${BACKEND_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped
    mem_limit: 256m

  frontend:
    build:
      context: .
      dockerfile: frontend/mlops-react-app/Dockerfile
      args:
        # Use REACT_APP_API_BASE from .env so the same compose file works
        # locally (http://localhost:8080/api) and on EC2 (http://<ip>:8080/api).
        REACT_APP_API_BASE: ${REACT_APP_API_BASE:-http://localhost:8080/api}
    container_name: mlops-a1-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 128m

volumes:
  pgdata:
